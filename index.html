<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photobooth</title>
<style>
  :root{
    --bg:#1a1225; --panel:#241934; --accent:#ff6fae; --accent2:#7c5cff;
    --gold:#ffd166; --text:#fff; --muted:#c9b8de;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0; background:var(--bg); overscroll-behavior:none;}
  body{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color:var(--text);
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    user-select:none; touch-action:manipulation;
  }
  #app{width:100%; max-width:760px; height:100%; display:flex; flex-direction:column; align-items:center; padding:16px; gap:14px;}
  h1{font-size:1.3rem; margin:6px 0 0; letter-spacing:.5px; background:linear-gradient(90deg,var(--accent),var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .stage{position:relative; width:100%; max-width:520px; aspect-ratio:3/4; border-radius:22px; overflow:hidden; background:#000; box-shadow:0 10px 40px rgba(0,0,0,.5);}
  video,canvas,#shotImg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  video{transform:scaleX(-1);}
  #frameOverlay{position:absolute; inset:0; pointer-events:none;}
  #countdown{position:absolute; inset:0; display:none; align-items:center; justify-content:center; font-size:5rem; font-weight:800; background:rgba(0,0,0,.25); color:#fff; text-shadow:0 4px 16px rgba(0,0,0,.6);}
  #flash{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none;}
  .frames{display:flex; gap:10px; width:100%; max-width:520px; justify-content:center;}
  .frameBtn{flex:1; padding:10px 6px; border-radius:14px; border:2px solid transparent; background:var(--panel); color:var(--muted); font-size:.8rem; font-weight:600; cursor:pointer;}
  .frameBtn.active{border-color:var(--accent); color:#fff; background:#33234a;}
  .swatch{width:100%; height:22px; border-radius:8px; margin-bottom:6px;}
  .controls{display:flex; gap:14px; align-items:center; margin-top:4px;}
  button.big{border:none; border-radius:999px; padding:16px 30px; font-size:1.05rem; font-weight:700; cursor:pointer;}
  #shootBtn{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; box-shadow:0 6px 20px rgba(255,111,174,.4);}
  #retakeBtn,#saveBtn{background:var(--panel); color:var(--text); border:1px solid #473360;}
  #saveBtn{background:linear-gradient(135deg,var(--gold),#ff9f4a); color:#331a00;}
  .hint{color:var(--muted); font-size:.8rem; text-align:center;}
  #result{display:none; flex-direction:column; align-items:center; gap:14px; width:100%;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div id="app">
  <h1>📸 Photobooth</h1>

  <div id="liveView" style="width:100%; display:flex; flex-direction:column; align-items:center; gap:14px;">
    <div class="stage">
      <video id="video" autoplay playsinline muted></video>
      <svg id="frameOverlay" viewBox="0 0 300 400" preserveAspectRatio="none"></svg>
      <div id="countdown"></div>
      <div id="flash"></div>
    </div>

    <div class="frames">
      <button class="frameBtn active" data-frame="classic">
        <div class="swatch" style="background:#fff;"></div>Classic
      </button>
      <button class="frameBtn" data-frame="party">
        <div class="swatch" style="background:linear-gradient(90deg,#ff6fae,#7c5cff,#ffd166);"></div>Party
      </button>
      <button class="frameBtn" data-frame="polaroid">
        <div class="swatch" style="background:#f5f0e6;"></div>Polaroid
      </button>
    </div>

    <div class="controls">
      <button class="big" id="shootBtn">Take Photo</button>
    </div>
    <div class="hint">Tap "Take Photo" — a 3-second countdown will start</div>
  </div>

  <div id="result">
    <div class="stage"><img id="shotImg" alt="Your photo"></div>
    <div class="controls">
      <button class="big" id="retakeBtn">Retake</button>
      <button class="big" id="saveBtn">Save Photo</button>
    </div>
    <div class="hint" id="saveHint"></div>
  </div>
</div>

<canvas id="canvas" width="900" height="1200" style="display:none;"></canvas>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const frameOverlay = document.getElementById('frameOverlay');
const countdownEl = document.getElementById('countdown');
const flashEl = document.getElementById('flash');
const liveView = document.getElementById('liveView');
const result = document.getElementById('result');
const shotImg = document.getElementById('shotImg');
const shootBtn = document.getElementById('shootBtn');
const retakeBtn = document.getElementById('retakeBtn');
const saveBtn = document.getElementById('saveBtn');
const saveHint = document.getElementById('saveHint');

let currentFrame = 'classic';
let stream = null;
let lastBlob = null;

// ---- Frame SVG previews (live overlay, viewBox 0 0 300 400) ----
const framePreviewSVG = {
  classic: `<rect x="6" y="6" width="288" height="388" fill="none" stroke="#ffffff" stroke-width="12" rx="14"/>`,
  party: `<rect x="5" y="5" width="290" height="390" fill="none" stroke="url(#g)" stroke-width="14" rx="18"/>
          <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ff6fae"/><stop offset="50%" stop-color="#7c5cff"/><stop offset="100%" stop-color="#ffd166"/>
          </linearGradient></defs>
          <circle cx="20" cy="20" r="6" fill="#ffd166"/><circle cx="280" cy="20" r="6" fill="#ff6fae"/>
          <circle cx="20" cy="380" r="6" fill="#7c5cff"/><circle cx="280" cy="380" r="6" fill="#ffd166"/>`,
  polaroid: `<rect x="0" y="0" width="300" height="400" fill="none"/>
             <rect x="0" y="0" width="300" height="400" fill="none" stroke="#f5f0e6" stroke-width="18"/>
             <rect x="0" y="330" width="300" height="70" fill="#f5f0e6"/>`
};

function setFrame(name){
  currentFrame = name;
  frameOverlay.innerHTML = framePreviewSVG[name];
  document.querySelectorAll('.frameBtn').forEach(b=>b.classList.toggle('active', b.dataset.frame===name));
}
document.querySelectorAll('.frameBtn').forEach(b=>{
  b.addEventListener('click', ()=> setFrame(b.dataset.frame));
});
setFrame('classic');

// ---- Camera ----
async function startCamera(){
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width:{ideal:1080}, height:{ideal:1440} },
      audio:false
    });
    video.srcObject = stream;
  }catch(err){
    liveView.innerHTML = '<div style="padding:20px;text-align:center;color:#f5a">'
      + '<p>Camera error:</p>'
      + '<p style="font-family:monospace; font-size:.85rem; color:#fff; word-break:break-word;">'
      + (err && err.name ? err.name : 'Unknown') + ': ' + (err && err.message ? err.message : String(err))
      + '</p></div>';
  }
}
startCamera();

// ---- Draw frame onto capture canvas (900x1200, matches 3:4) ----
function drawFrame(name, w, h){
  ctx.save();
  if(name==='classic'){
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = w*0.045;
    ctx.strokeRect(ctx.lineWidth/2, ctx.lineWidth/2, w-ctx.lineWidth, h-ctx.lineWidth);
  } else if(name==='party'){
    const grad = ctx.createLinearGradient(0,0,w,h);
    grad.addColorStop(0,'#ff6fae'); grad.addColorStop(.5,'#7c5cff'); grad.addColorStop(1,'#ffd166');
    ctx.strokeStyle = grad;
    ctx.lineWidth = w*0.05;
    ctx.strokeRect(ctx.lineWidth/2, ctx.lineWidth/2, w-ctx.lineWidth, h-ctx.lineWidth);
    const dots = [['#ffd166',0.06,0.05],['#ff6fae',0.94,0.05],['#7c5cff',0.06,0.95],['#ffd166',0.94,0.95]];
    dots.forEach(([c,x,y])=>{ ctx.fillStyle=c; ctx.beginPath(); ctx.arc(w*x,h*y,w*0.02,0,Math.PI*2); ctx.fill(); });
  } else if(name==='polaroid'){
    ctx.fillStyle = '#f5f0e6';
    const border = w*0.05, bottom = h*0.16;
    // top/side/bottom bars drawn by punching a hole is complex on canvas already-photo;
    // instead draw four rectangles forming a frame
    ctx.fillRect(0,0,w,border);
    ctx.fillRect(0,0,border,h);
    ctx.fillRect(w-border,0,border,h);
    ctx.fillRect(0,h-bottom,w,bottom);
  }
  ctx.restore();
}

// ---- Capture flow ----
let counting = false;
shootBtn.addEventListener('click', ()=>{
  if(counting || !stream) return;
  counting = true;
  let n = 3;
  countdownEl.style.display='flex';
  countdownEl.textContent = n;
  const tick = setInterval(()=>{
    n--;
    if(n>0){ countdownEl.textContent = n; }
    else {
      clearInterval(tick);
      countdownEl.style.display='none';
      takePhoto();
      counting = false;
    }
  },800);
});

function takePhoto(){
  flashEl.style.transition='none'; flashEl.style.opacity='1';
  requestAnimationFrame(()=>{
    flashEl.style.transition='opacity .4s'; flashEl.style.opacity='0';
  });

  const w = canvas.width, h = canvas.height;
  // draw mirrored video (selfie view) covering canvas
  ctx.save();
  ctx.translate(w,0); ctx.scale(-1,1);
  const vw = video.videoWidth, vh = video.videoHeight;
  const targetRatio = w/h, srcRatio = vw/vh;
  let sx,sy,sw,sh;
  if(srcRatio > targetRatio){ sh=vh; sw=vh*targetRatio; sx=(vw-sw)/2; sy=0; }
  else { sw=vw; sh=vw/targetRatio; sx=0; sy=(vh-sh)/2; }
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, w, h);
  ctx.restore();

  drawFrame(currentFrame, w, h);

  canvas.toBlob(blob=>{
    lastBlob = blob;
    shotImg.src = URL.createObjectURL(blob);
    liveView.style.display='none';
    result.style.display='flex';
    saveHint.textContent = '';
  }, 'image/png');
}

retakeBtn.addEventListener('click', ()=>{
  result.style.display='none';
  liveView.style.display='flex';
});

saveBtn.addEventListener('click', async ()=>{
  if(!lastBlob) return;
  const filename = `photobooth-${Date.now()}.png`;
  let saved = false;
  try{
    const downloads = window.claude && (await window.claude.use('downloads'));
    if(downloads){
      const buf = await lastBlob.arrayBuffer();
      const b64 = btoa(String.fromCharCode(...new Uint8Array(buf)));
      await downloads.save({ filename, data: b64 });
      saved = true;
    }
  }catch(e){ /* fall through to link method */ }

  if(!saved){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(lastBlob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }
  saveHint.textContent = 'Saved! Tap Retake to take another photo.';
});
</script>
</body>
</html>
